name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test & Build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm --filter phaestus typecheck

      - name: Lint
        run: pnpm --filter phaestus lint

      - name: Run tests
        run: pnpm --filter phaestus test:run

      - name: Build
        run: pnpm --filter phaestus build

      - name: Install kicad-service dependencies
        run: npm ci --prefix kicad-service

      - name: Build kicad-service
        run: npm --prefix kicad-service run build

      - name: Install platformio-service dependencies
        run: npm ci --prefix platformio-service

      - name: Build platformio-service
        run: npm --prefix platformio-service run build
