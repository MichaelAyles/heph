version: '3.8'
services:
  platformio-service:
    build: .
    ports:
      - "3002:3000"
    volumes:
      - ./dist:/app/dist
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
